name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: go build -o bin/gateway ./cmd/gateway
      - run: python3 scripts/smoke.py bin/gateway
      - run: go build -o bin/raftpeer ./cmd/raftpeer
      - run: python3 scripts/raft_process_check.py bin/raftpeer --output artifacts/raft-process/ci.json
